<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8" />
  <title>play.sidelower.in</title>
  <script>
    // Redirect GitHub Pages 404s into the SPA
    // Technique: encode the path as a query param, redirect to index
    var l = window.location;
    var path = l.pathname.split('/').slice(0, 1).join('/') + '/';
    var query = '?p=' + encodeURIComponent(l.pathname + l.search);
    var hash = l.hash ? '&h=' + encodeURIComponent(l.hash.slice(1)) : '';
    l.replace(l.origin + path + query + hash);
  </script>
</head>

<body></body>

</html>
